# Escenarios de DTE recibidos para `seed_demo` — no es un fixture de
# datos ya construidos (a diferencia de `document.examples`, de la
# biblioteca): cada `documento` acá es la entrada de
# `exchange.build_fake_sobre()` (Encabezado.IdDoc/Detalle; Emisor y
# Receptor los completa `seed_demo` con los datos de `proveedor` y del
# contribuyente de la demo). `seed_demo` arma, timbra y firma cada
# documento con un CAF/certificado ficticio del proveedor (nada de eso
# se persiste) y envuelve TODOS los documentos de un mismo `proveedor`
# juntos en un único sobre `EnvioDTE` real (`create_many()`) antes de
# pasarlo por `exchange.load_xml()` — el mismo camino que seguiría un
# sobre recibido de verdad.
#
# Cada `proveedor` es un emisor distinto (`Emisor.rut`/`dv` acaba
# siendo distinto para cada uno). Como cada uno ya tiene más de un
# `documento`, esto ejercita el caso de un sobre con 2+ documentos sin
# necesidad de un caso aparte.

