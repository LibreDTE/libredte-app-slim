{% if widget.is_initial %}
  <div class="mb-2">
    <img src="{{ widget.value.url }}" alt="Logo" class="border rounded p-1 bg-white" style="max-height: 80px;">
  </div>
  {% if not widget.required %}
    <div class="form-check mb-2">
      <input type="checkbox" class="form-check-input" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}"{% if widget.attrs.disabled %} disabled{% endif %}{% if widget.attrs.checked %} checked{% endif %}>
      <label class="form-check-label" for="{{ widget.checkbox_id }}">{{ widget.clear_checkbox_label }}</label>
    </div>
  {% endif %}
{% endif %}
<input type="{{ widget.type }}" name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" %}>
