<div class="input-group">
  <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
  <input type="{{ widget.type }}" name="{{ widget.name }}"{% if widget.value != None %} value="{{ widget.value|stringformat:'s' }}"{% endif %}{% include "django/forms/widgets/attrs.html" %}>
  <a class="input-group-text" style="cursor:pointer;text-decoration:none" onclick="FormFields.showPassword(this)" aria-label="Mostrar u ocultar la contraseña" title="Mostrar u ocultar la contraseña">
    <i class="fa-regular fa-eye fa-fw"></i>
  </a>
  <a class="input-group-text" style="cursor:pointer;text-decoration:none" onclick="UI.copy(this.closest('.input-group').querySelector('input, textarea'), 'Valor copiado.')" aria-label="Copiar valor" title="Copiar valor">
    <i class="fa-regular fa-copy fa-fw"></i>
  </a>
</div>
