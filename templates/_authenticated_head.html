<script>
  // Aplica el tema y el estado del menú ANTES de que llegue el CSS —
  // sin esto, la página pinta primero en claro/menú expandido y
  // recién después salta al valor guardado (flash visible). Se
  // guarda en localStorage porque es puramente de presentación en
  // este navegador, no algo que el servidor necesite saber.
  (function () {
    try {
      var tema = localStorage.getItem('slim-theme');
      if (tema === 'dark' || tema === 'light') {
        document.documentElement.setAttribute('data-bs-theme', tema);
      }
      if (localStorage.getItem('slim-sidebar-collapsed') === '1') {
        document.documentElement.setAttribute('data-sidebar', 'collapsed');
      }
    } catch (error) {
      // localStorage puede no estar disponible (modo privado, etc.)
      // — sin persistencia, pero la página igual funciona.
    }
  })();
</script>
