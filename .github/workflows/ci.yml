name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  tests:
    name: Tests
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Display Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run Ruff (lint)
        run: ruff check .

      - name: Run Ruff (format)
        run: ruff format --check .

      - name: Run mypy
        run: mypy

      # Sin llamadas a la API real: todo lo que toca el SDK está
      # mockeado (ver `apps/billing/tests/`) — no hace falta ningún
      # secreto ni servicio externo para correr esta suite (SECRET_KEY/
      # FIELD_ENCRYPTION_KEY tienen fallback de desarrollo en
      # `settings.py`, y la DB por defecto es SQLite).
      - name: Run pytest
        run: |
          mkdir -p var
          pytest -v --junitxml=var/tests-results.xml

      - name: Upload pytest result report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-results.xml
          path: var/tests-results.xml
