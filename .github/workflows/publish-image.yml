name: Publish Docker Image

# Publica la imagen solo al subir un tag de versión (ej. v0.1.0b1). El tag debe
# coincidir con la `version` de pyproject.toml.
on:
  push:
    tags:
      - 'v*'

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and publish
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify the tag matches the version in pyproject.toml
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::El tag ${GITHUB_REF_NAME} no coincide con la version de pyproject.toml (v${version})."
            exit 1
          fi

      - name: Set image name (lowercase)
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (single-platform, loaded locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: libredte-app-slim:ci-test
          build-args: |
            SLIM_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image
        run: |
          set -e
          # Con DEBUG=0 la app exige las dos claves; estas son solo para la prueba.
          # root: sin PostgreSQL, Django usa un SQLite dentro de /app.
          run_in_image() {
            docker run --rm --user root \
              -e DEBUG=0 -e SECRET_KEY=ci-test -e FIELD_ENCRYPTION_KEY=xINwuGhSdjArtaaD20eChabDNcCbpTKREzPGpbaT28U= \
              -e STATIC_ROOT=/tmp/static -e MEDIA_ROOT=/tmp/media \
              libredte-app-slim:ci-test "$@"
          }
          run_in_image python manage.py check
          label="$(run_in_image python manage.py shell -c "from apps.core.version import get_version_label; print(get_version_label())")"
          echo "Pie: ${label}"
          expected="${GITHUB_SHA:0:7}"
          case "${label}" in
            *"${expected}"*) ;;
            *) echo "::error::El pie (${label}) no incluye el commit ${expected}."; exit 1 ;;
          esac

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El tag de la imagen es el del git (ej. v0.1.0b1). Sin `latest` mientras
      # no haya una versión estable.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SLIM_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
